server {
    listen 80;              # listens inside docker (mapped to 8080 outside)
    server_name _;          # accept any hostname
    root /var/www/public;   # Laravel's public folder = entry point
    index index.php index.html;

    # Pass ALL PHP requests to Laravel container
    location ~ \.php$ {
        fastcgi_pass  app:9000;           # service name:port
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME
                      $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    # Route everything through index.php (Laravel routing)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block access to hidden files like .env, .git
    location ~ /\. {
        deny all;
    }
}