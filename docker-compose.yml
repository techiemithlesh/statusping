services:

  statusping:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /var/www
    cpus: "4"
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www

    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      PULSE_ENABLED: true
      L5_SWAGGER_CONST_HOST: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy


  mysql:
    image: mysql:8.0
    cpus: "2"
    environment:
      MYSQL_DATABASE: statusping
      MYSQL_USER: statusping
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: "phpmyadmin"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  adminer: 
    image: adminer
    ports:
      - 8081:8080  
    depends_on:
      - mysql
  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  queue:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --max-time=3600

    restart: unless-stopped

    volumes:
      - .:/var/www

    environment:
      DB_HOST: mysql
      REDIS_HOST: redis

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - .:/var/www:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro

    depends_on:
      - statusping
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8082:8080"
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
    depends_on:
            - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" 
    environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
            - grafana_data:/var/lib/grafana
    depends_on:
            - prometheus

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
